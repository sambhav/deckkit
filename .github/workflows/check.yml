name: Parser checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  parser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --check deck.js
      - run: node --test tests/parser.test.cjs
