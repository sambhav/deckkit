# Widget gallery

Live examples of Talkdown's Markdown-powered widgets.

[Main demo](./) · [Documentation](https://github.com/sambhav/talkdown#widgets)

::: notes
Every example in this gallery is authored in Markdown. Press S to inspect and copy the source of a slide, or R to read everything as an article. The main demo introduces Talkdown and explains the presentation experience.
:::

id: w-annotate

## Annotated code

```python {annotate}
def save(rows, dsn):
    conn = pool.connect(dsn)          # (1)
    with conn.transaction():          # (2)
        for row in rows:
            conn.execute(INSERT, row)
    return len(rows)                  # (3)
```
1. Borrows one connection from the pool instead of opening a new one.
2. Every insert inside commits together, or none of them do.
3. The caller learns how many rows were written.

::: notes
Each ↓ lights one numbered line and its note; in the article the notes sit beside the code.

id: w-diff

## Diff, one hunk at a time

```diff {steps: hunks} title="client.py"
@@ def fetch(url):
-    return requests.get(url)
+    return session.get(url, timeout=5)
@@ def retry(call, attempts=3):
     for attempt in range(attempts):
-        time.sleep(1)
+        time.sleep(2 ** attempt)
         try:
```

::: notes
Press down to highlight each hunk in turn. Copy takes the new code, and the article shows the whole diff.
:::
